spring:
  threads:
    virtual:
      enabled: true   # threads virtuais (Java 21+): cada requisição numa thread leve, sem um conjunto fixo de threads
  application:
    name: task-api
  # Banco: no cluster (database: true no deploy.yml) as variáveis DB_* já vêm
  # prontas, com a senha sorteada pelo pipeline: não troque nada para publicar.
  # O texto depois de cada ":" é só a reserva para rodar na sua máquina.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:senha-do-mysql-da-sua-maquina}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5     # conexões com o banco (o padrão é 10)
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${SECRET_KEY:chave-usada-so-na-sua-maquina-no-cluster-vale-a-variavel-SECRET_KEY}   # no cluster vale a SECRET_KEY criada pelo pipeline; o texto depois do ":" só vale na sua máquina
  expiration: 86400000   # 24 horas em milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
