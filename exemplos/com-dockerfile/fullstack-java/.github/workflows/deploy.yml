name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ss-cstads/deploy-apps/.github/workflows/deploy.yml@v2
    secrets:
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      APP_ENV: ${{ secrets.APP_ENV }}
    with:
      frontend: frontend
      port: 80
      memory: 64                # o frontend é só o nginx: usa uns 20 MB
      health: /health
      backend: backend
      backend_health: /actuator/health
      backend_memory: 320   # o backend Java cabe em 320 MB com a JVM enxuta deste exemplo
      database: true
