name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ss-cstads/deploy-apps/.github/workflows/deploy.yml@v2
    secrets:
      repo_secrets: ${{ toJSON(secrets) }}
    with:
      frontend: frontend
      port: 80
      health: /health
      backend: backend
      database: true
