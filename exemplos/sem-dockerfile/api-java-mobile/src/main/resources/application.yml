# O cluster entrega a conexão com o banco (DB_*) e a porta (PORT).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}
  # Atrás do HTTPS do cluster: links da documentação saem com https://
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs
