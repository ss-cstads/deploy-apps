# nginx do frontend (sem Dockerfile). {{port}} é a porta que o cluster informa
# (opção port do deploy.yml); os arquivos gerados pelo build ficam em dist/.
worker_processes 1;
daemon off;
error_log stderr;
events { worker_connections 1024; }

http {
  charset utf-8;
  access_log /dev/stdout;
  types {
    text/html html;  text/css css;  application/javascript js mjs;  application/json json map;
    image/svg+xml svg;  image/png png;  image/jpeg jpg jpeg;  image/gif gif;  image/webp webp;
    image/x-icon ico;  font/woff woff;  font/woff2 woff2;  font/ttf ttf;  text/plain txt;
  }
  default_type application/octet-stream;
  sendfile on;
  client_body_temp_path {{ tempDir }}/client_body_temp;
  proxy_temp_path {{ tempDir }}/proxy_temp;
  fastcgi_temp_path {{ tempDir }}/fastcgi_temp;

  server {
    listen {{port}};
    root /workspace/dist;
    index index.html;

    # Rota de saúde usada pelo cluster (health: /health no deploy.yml)
    location /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # API: o backend está em 127.0.0.1:8080 (backend_port do deploy.yml)
    location /api/ {
      proxy_pass http://127.0.0.1:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: todas as rotas caem no index.html
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
