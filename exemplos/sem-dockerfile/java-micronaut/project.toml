[_]
schema-version = "0.2"

# Java 25 (o padrão do pipeline é o 21; o Micronaut 5 exige o 25)
[[io.buildpacks.build.env]]
name = "BP_JVM_VERSION"
value = "25"

# JVM enxuta para protótipo acadêmico (menos threads e menos memória reservada):
# sem isto a imagem reserva memória para 250 threads e o app não sobe com 256 MB.
[[io.buildpacks.build.env]]
name = "BPE_OVERRIDE_BPL_JVM_THREAD_COUNT"
value = "30"

[[io.buildpacks.build.env]]
name = "BPE_DELIM_JAVA_TOOL_OPTIONS"
value = " "

[[io.buildpacks.build.env]]
name = "BPE_APPEND_JAVA_TOOL_OPTIONS"
value = "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48M -Xss512k -XX:+UseCompactObjectHeaders"

# Sem o relatório de memória que a JVM imprime ao sair: ele ocupava as últimas
# linhas do log e escondia o erro quando o app caía ao iniciar
[[io.buildpacks.build.env]]
name = "BPE_BPL_JAVA_NMT_ENABLED"
value = "false"
